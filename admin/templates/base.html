<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="csrf-token" content="{{ csrf|default('') }}">
<title>{% block title %}randompics · Verwaltung{% endblock %}</title>
<style>
  :root { color-scheme: dark; --bg:#0f1214; --panel:#171c1f; --line:#2a3338; --ink:#e8ecee;
    --muted:#96a2a8; --ok:#7fd1a0; --warn:#e0b36a; --focus:#9cc7ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, sans-serif; }
  body.modal-open { overflow:hidden; }
  a { color:var(--focus); }
  header.top { display:flex; gap:1rem; align-items:center; justify-content:space-between;
    padding:1rem 1.25rem; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header.top h1 { font-size:1.05rem; margin:0; letter-spacing:.02em; }
  .brand { font-size:1.05rem; font-weight:700; letter-spacing:.02em; }
  main { max-width:1200px; margin:0 auto; padding:1.25rem; }
  .muted { color:var(--muted); }
  .back { display:inline-block; color:var(--muted); font-size:.9rem; margin:0 0 .6rem; }
  .back:hover { color:var(--ink); }
  .badge { display:inline-block; padding:.15rem .5rem; border-radius:999px; font-size:.78rem;
    border:1px solid var(--line); font-weight:600; letter-spacing:.04em; white-space:nowrap; }
  .badge.pub { color:var(--ok); border-color:#2f6b4a; }
  .badge.priv { color:var(--warn); border-color:#6b542f; }
  .badge.mixed { color:#c9c2f0; border-color:#4a4370; }
  .album { border:1px solid var(--line); border-radius:10px; padding:1rem; margin:0 0 1.25rem; background:var(--panel); }
  .album h2 { margin:0 0 .35rem; font-size:1.15rem; }
  .album .head { display:flex; gap:.6rem; align-items:baseline; flex-wrap:wrap; }
  .album-head { display:flex; gap:.8rem; align-items:center; flex-wrap:wrap; margin:.2rem 0 1rem; }
  .album-head > div { flex:1 1 320px; }
  .upload-status { grid-column:1 / -1; margin:.1rem 0 0; font-size:.82rem; }
  .legend { line-height:1.4; }
  input[type=checkbox] { accent-color:var(--ok); }
  .tool-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(380px, 1fr)); gap:1rem; align-items:start; }
  .tool-grid .album { margin:0; }
  details.rename { margin:.5rem 0 0; }
  details.rename summary { cursor:pointer; color:var(--muted); font-size:.85rem; }
  details.rename summary:hover { color:var(--ink); }
  .row { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin:.6rem 0; }
  button, input, select { font:inherit; max-width:100%; }
  input[type=text], input[type=url], input[type=search], input[type=number], select {
    background:#101518; color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:.35rem .5rem; min-width:0; }
  input[type=search] { width:16rem; }
  input[type=file] { color:var(--muted); max-width:100%; }
  input[type=file]::file-selector-button { background:#22313a; color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:.35rem .6rem;
    margin-right:.5rem; cursor:pointer; font:inherit; }
  input[type=file]::file-selector-button:hover { border-color:#4a5c66; }
  .score { font-variant-numeric: tabular-nums; }
  .weak { color:var(--warn); }
  button { background:#22313a; color:var(--ink); border:1px solid var(--line); border-radius:8px;
    padding:.4rem .7rem; cursor:pointer; min-height:34px; }
  button:hover { border-color:#4a5c66; }
  button:disabled { opacity:.6; cursor:progress; }
  button.danger { border-color:#6b3434; color:#f0b4b4; }
  input[type=number] { width:5rem; }
  .button-link { display:inline-block; padding:.35rem .65rem; border:1px solid var(--line);
    border-radius:8px; background:#22313a; color:var(--ink); text-decoration:none; line-height:1.3; }
  .button-link:hover { border-color:#4a5c66; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .flash { padding:.6rem .8rem; border-radius:8px; margin:.4rem 0; border:1px solid var(--line); }
  .flash.ok { border-color:#2f6b4a; }
  .flash.error { border-color:#6b3434; }

  /* album index */
  .index-head { display:flex; gap:.8rem; align-items:center; justify-content:space-between;
    flex-wrap:wrap; margin-bottom:.8rem; }
  .index-head h2 { margin:0; }
  .album-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:1rem; }
  .album-card { border:1px solid var(--line); border-radius:10px; overflow:hidden;
    background:#101518; display:flex; flex-direction:column; }
  .album-card[hidden] { display:none; }
  .album-cover { display:block; aspect-ratio:4/3; background:#101518; overflow:hidden; }
  .album-cover img { display:block; width:100%; height:100%; object-fit:cover; }
  .cover-empty { display:flex; align-items:center; justify-content:center; height:100%;
    color:var(--muted); font-size:.85rem; border-bottom:1px solid var(--line); }
  .album-body { padding:.8rem; display:flex; flex-direction:column; gap:.4rem; align-items:flex-start; flex:1; }
  .album-body h3 { margin:0; font-size:1.02rem; line-height:1.25; }
  .album-body h3 a { color:var(--ink); text-decoration:none; }
  .album-body h3 a:hover { text-decoration:underline; }
  .album-body p { margin:0; font-size:.82rem; }
  .album-body .button-link { align-self:flex-start; margin-top:auto; font-size:.85rem; }
  .empty { color:var(--muted); padding:1rem; border:1px dashed var(--line); border-radius:8px; }

  /* forms */
  .upload-form, .form-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:.6rem; align-items:end; }
  .upload-form .field, .form-grid .field { display:flex; flex-direction:column; gap:.25rem; min-width:0; }
  .upload-form .field > select, .upload-form .field > input,
  .form-grid .field > input { width:100%; }
  .upload-form .field-wide { grid-column:1 / -1; }
  .upload-form > button { justify-self:start; align-self:start; }
  .form-actions { display:flex; gap:.8rem; align-items:center; flex-wrap:wrap; grid-column:1 / -1; }
  .field-label { font-size:.82rem; }

  /* photo tiles */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:.6rem; margin-top:.8rem; }
  .tile { border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#101518; margin:0; }
  .tile[hidden] { display:none; }
  .tile .thumb { display:block; width:100%; padding:0; border:0; background:#101518; cursor:zoom-in; }
  .tile img { display:block; width:100%; height:auto; aspect-ratio:4/3; object-fit:cover; }
  .tile .meta { display:flex; flex-direction:column; gap:.35rem; padding:.45rem;
    font-size:.75rem; color:var(--muted); }
  .tile .score { line-height:1.35; overflow-wrap:anywhere; }
  .tile-actions { display:flex; gap:.35rem; flex-wrap:wrap; }
  .tile-actions form { margin:0; }
  .tile-actions button { padding:.25rem .45rem; font-size:.72rem; min-height:30px; }
  .badge.depth { color:var(--warn); border-color:#6b542f; }
  .depth-badge { display:block; color:var(--warn); font-size:.78rem; margin-top:.15rem; }
  .depth-badge[hidden] { display:none; }
  .depth-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:.8rem; margin-top:.8rem; }
  .depth-form { display:flex; flex-direction:column; gap:.3rem; margin:.2rem 0 0; }
  .depth-form input[type=text] { width:100%; padding:.35rem .45rem; border-radius:6px;
    border:1px solid var(--line); background:#0f1214; color:var(--ink); }
  .depth-form button, .depth-tile .button-link { align-self:flex-start; font-size:.75rem;
    padding:.25rem .45rem; }
  .depth-note { margin:.1rem 0; color:var(--ink); font-size:.8rem; border-left:2px solid #6b542f;
    padding-left:.45rem; overflow-wrap:anywhere; }
  .depth-updated { margin:0; font-size:.72rem; }

  /* shares */
  .shares { display:flex; flex-direction:column; gap:.45rem; margin:.4rem 0; }
  .share { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; font-size:.9rem;
    padding:.5rem .6rem; border:1px dashed var(--line); border-radius:8px; }
  .share code { color:#cfe8ff; overflow-wrap:anywhere; word-break:break-word; }
  .share form { margin:0; }
  .hint { font-size:.82rem; margin:.35rem 0 .6rem; }
  .subhead { font-size:.88rem; margin:.9rem 0 .25rem; letter-spacing:.02em; }

  /* duplicates */
  .pairs { display:flex; flex-direction:column; gap:1rem; margin-top:.8rem; }
  .pair { display:flex; gap:1rem; align-items:flex-start; border:1px solid var(--line);
    border-radius:10px; padding:.8rem; background:var(--panel); flex-wrap:wrap; }
  .pair-tiles { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; flex:1 1 600px; max-width:860px; }
  .pair-meta { display:flex; flex-direction:column; gap:.5rem; align-items:flex-start; min-width:11rem; }
  .pair-meta .sim { font-variant-numeric:tabular-nums; }

  /* lightbox */
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.9); display:flex;
    align-items:center; justify-content:center; flex-direction:column; gap:.6rem;
    z-index:50; padding:1rem; }
  #lightbox[hidden] { display:none; }
  #lightbox iframe { width:min(96vw,1280px); height:82vh; border:0; background:#000; border-radius:6px; }
  #lightbox p { color:#cfd6da; font-size:.85rem; margin:0; }
  .lightbox-close { position:absolute; top:1rem; right:1rem; }
  .lightbox-depth { position:absolute; top:1rem; left:1rem; }
  .lightbox-nav { position:absolute; top:50%; transform:translateY(-50%); font-size:1.6rem;
    padding:.35rem .7rem; background:rgba(23,28,31,.9); }
  .lightbox-nav.prev { left:1rem; }
  .lightbox-nav.next { right:1rem; }

  /* login */
  .login { max-width:22rem; margin:12vh auto; padding:1.4rem; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; }
  .login h1 { font-size:1.1rem; margin:0 0 1rem; }
  .login input[type=password] { width:100%; padding:.55rem .6rem; border-radius:8px;
    border:1px solid var(--line); background:#101518; color:var(--ink); }
  .login button { width:100%; margin-top:.8rem; }
  footer.note { color:var(--muted); font-size:.82rem; margin-top:1.5rem; }

  @media (max-width: 700px) {
    .tool-grid { grid-template-columns:1fr; }
    .album-grid { grid-template-columns:1fr; }
    .album-cover { aspect-ratio:16/9; }
    .pair-tiles { grid-template-columns:1fr 1fr; max-width:none; }
    #lightbox iframe { height:76vh; }
    .lightbox-depth, .lightbox-close { font-size:.78rem; padding:.25rem .45rem; max-width:55vw; }
    .lightbox-nav { top:auto; bottom:5.5rem; transform:none; }
    .lightbox-nav.prev { left:25%; }
    .lightbox-nav.next { right:25%; }
    .upload-form > button, .form-actions button { justify-self:stretch; width:100%; }
  }
  @media (max-width: 520px) {
    .grid { grid-template-columns:repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 360px) {
    .grid { grid-template-columns:1fr; }
  }
  @media (pointer: coarse) {
    button, .button-link { min-height:44px; }
    .tile-actions button { min-height:44px; }
    input:not([type=hidden]):not([type=checkbox]):not([type=radio]):not([type=range]),
    select, textarea { min-height:44px; }
    input[type=checkbox], input[type=radio] { width:22px; height:22px; }
    .check { display:inline-flex; align-items:center; gap:.4rem; min-height:44px; }
  }
</style>
</head>
<body>
{% block body %}{% endblock %}
<script>
(function () {
  document.querySelectorAll("form[data-upload]").forEach(function (form) {
    const button = form.querySelector('button[type="submit"]');
    const status = form.querySelector("[data-upload-status]");
    const files = form.querySelector('input[type="file"]');
    const buttonText = button ? button.textContent : "";
    const statusText = status ? status.textContent : "";
    if (files) {
      files.addEventListener("change", function () {
        if (status) {
          status.textContent = files.files.length + " Datei(en) ausgewählt. " + statusText;
        }
      });
    }
    form.addEventListener("submit", function () {
      if (button) {
        button.disabled = true;
        button.textContent = "Lädt hoch & rendert …";
      }
      if (status) {
        status.textContent = "Upload läuft. Bei mehreren Fotos kann das einige Minuten dauern — Seite nicht schließen.";
      }
    });
    window.addEventListener("pageshow", function () {
      if (button) {
        button.disabled = false;
        button.textContent = buttonText;
      }
      if (status) status.textContent = statusText;
    });
  });

  document.addEventListener("submit", function (event) {
    const form = event.target.closest("form[data-confirm]");
    if (!form) return;
    if (!window.confirm(form.dataset.confirm)) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }
  });

  document.addEventListener("click", function (event) {
    const button = event.target.closest("[data-copy]");
    if (!button) return;
    const value = button.dataset.copy || "";
    const original = button.textContent;
    function done() {
      button.textContent = "Kopiert ✓";
      window.setTimeout(function () { button.textContent = original; }, 1500);
    }
    function fallbackCopy() {
      const area = document.createElement("textarea");
      area.value = value;
      document.body.appendChild(area);
      area.select();
      try {
        document.execCommand("copy");
        done();
      } catch (error) {
        button.textContent = "Nicht kopiert";
      }
      area.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(value).then(done).catch(fallbackCopy);
      return;
    }
    fallbackCopy();
  });
})();
</script>
</body>
</html>
